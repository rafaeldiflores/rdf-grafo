<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- rdf-grafo: planeta con anillo (un proyecto) y tres nodos conectados (sus tecnologías). -->
  <defs>
    <radialGradient id="planeta" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#cfe4ff"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="halo" r="50%">
      <stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070b"/>
  <!-- aristas -->
  <g stroke="#8fa3bf" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
    <line x1="30" y1="34" x2="13" y2="14"/>
    <line x1="30" y1="34" x2="52" y2="16"/>
    <line x1="30" y1="34" x2="50" y2="52"/>
  </g>
  <!-- nodos satélite -->
  <circle cx="13" cy="14" r="5.5" fill="#2dd4bf"/>
  <circle cx="52" cy="16" r="5" fill="#ff8a3d"/>
  <circle cx="50" cy="52" r="5.5" fill="#a3e635"/>
  <!-- planeta con anillo -->
  <circle cx="30" cy="34" r="17" fill="url(#halo)"/>
  <ellipse cx="30" cy="34" rx="17" ry="5.5" fill="none" stroke="#93c5fd" stroke-width="2.2" transform="rotate(-22 30 34)" opacity="0.9"/>
  <circle cx="30" cy="34" r="10" fill="url(#planeta)"/>
  <!-- parte delantera del anillo, por encima del planeta -->
  <path d="M 14.6 40.2 A 17 5.5 -22 0 0 45.4 27.8" fill="none" stroke="#bfdbfe" stroke-width="2.2" stroke-linecap="round" transform="rotate(0)"/>
</svg>
